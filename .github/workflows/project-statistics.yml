name: Refresh project statistics

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - README.md
      - stats/projects.json
      - scripts/**
      - .github/workflows/project-statistics.yml

permissions: {}

concurrency:
  group: project-statistics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.ref_type == 'branch' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Collect and render project statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_project_statistics.py --config stats/projects.json

      - name: Commit updated snapshots
        env:
          STATISTICS_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- stats/data.json assets/project-statistics
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh project statistics'
          git push origin "HEAD:refs/heads/$STATISTICS_BRANCH"
